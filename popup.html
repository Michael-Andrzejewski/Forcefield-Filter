<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forcefield</title>
  <style>
    body {
      width: 250px;
      padding: 10px;
      font-family: sans-serif;
    }
    #inputContainer {
      display: flex;
      margin-bottom: 10px;
    }
    #wordInput {
      flex-grow: 1;
      margin-right: 5px;
    }
    #blockList {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      background-color: #eee;
      padding: 2px 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      font-size: 0.9em;
    }
    .tag span {
      margin-right: 5px;
    }
    .tag button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1em;
      padding: 0 0 0 5px;
      line-height: 1;
      color: #999;
    }
    .tag button:hover {
      color: #333;
    }
    .tag input[type=number] { /* Style for the level input */
      width: 40px; /* Adjust width as needed */
      margin-left: 8px;
      margin-right: -5px; /* Pull remove button closer */
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9em;
      /* Hide default arrows (optional, but can look cleaner) */
      -moz-appearance: textfield; /* Firefox */
    }
    .tag input[type=number]::-webkit-outer-spin-button,
    .tag input[type=number]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    #actionButtonContainer {
      text-align: center;
      margin-top: 15px;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div id="inputContainer">
    <input type="text" id="wordInput" placeholder="Add word or phrase">
    <button id="addButton">Add</button>
  </div>
  <div id="blockList"></div>

  <div id="actionButtonContainer">
    <button id="blockButton">Block Content on Page</button>
    <button id="aiSuggestButton" style="margin-top: 5px;">Suggest Blocks (AI)</button>
    <button id="clearAllButton" style="margin-top: 5px;">Clear All Blocks</button>
    <button id="startScanningButton" style="margin-top: 5px;">Start Scanning</button>
    <button id="stopScanningButton" style="margin-top: 5px; display: none;">Stop Scanning</button>
  </div>

  <div id="aiModelContainer" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
    <h4 style="margin-top: 0; margin-bottom: 5px;">AI Model:</h4>
    <select id="aiModelSelect" style="width: 98%; margin-bottom: 5px;">
      <!-- Options will be populated by JavaScript -->
    </select>
    <!-- No save button needed, will save on change or on use -->
  </div>

  <div id="systemPromptContainer" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
    <h4 style="margin-top: 0; margin-bottom: 5px;">AI System Prompt:</h4>
    <textarea id="systemPromptText" rows="6" style="width: 98%; margin-bottom: 5px;"></textarea>
    <button id="saveSystemPromptButton">Save Prompt</button>
    <button id="resetSystemPromptButton">Reset to Default</button>
  </div>

  <div id="userPromptPrefixContainer" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
    <h4 style="margin-top: 0; margin-bottom: 5px;">AI User Prompt Prefix:</h4>
    <textarea id="userPromptPrefixText" rows="4" style="width: 98%; margin-bottom: 5px;"></textarea>
    <button id="saveUserPromptPrefixButton">Save Prefix</button>
    <button id="resetUserPromptPrefixButton">Reset to Default</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
